name: cabmate-legacy
services:
  legacy:
    image: caddy@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    user: '501:20'
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    restart: unless-stopped
    volumes:
      - ./legacy.Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      platform-web:
        aliases: [cabmate-legacy]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /config:uid=501,gid=20,mode=0700
      - /data:uid=501,gid=20,mode=0700
    mem_limit: 32m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: '1m'
        max-file: '2'
networks:
  platform-web:
    external: true
