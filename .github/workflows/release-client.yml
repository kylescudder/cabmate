name: Release client

# Builds apps/client into a single Windows .exe and a Linux (Proton) binary via
# `bun build --compile` and attaches both to a GitHub Release. Triggered by pushing a tag like
# `v0.1.0`, or run manually via the Actions tab. Each binary is built on its own
# OS: bun 1.2.16 fails to cross-compile the Linux target on Windows runners.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: windows-latest
            script: build:exe
            file: ets2-tracker.exe
          - runner: ubuntu-latest
            script: build:linux
            file: ets2-tracker
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Compile ${{ matrix.file }}
        run: bun run --filter @ets2/client ${{ matrix.script }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/client/dist/${{ matrix.file }}
          generate_release_notes: true

      - name: Upload as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: apps/client/dist/${{ matrix.file }}
